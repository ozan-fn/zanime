root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  delay = 1000
  include_ext = ["go"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_test.go"]
  log = "build-errors.log"
  stop_on_error = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
