[package]
name = "zanime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
librqbit = "8"
librqbit-core = "5"
# crypto-hash (lewat librqbit-sha1-wrapper) memakai openssl; build dari source
# supaya tidak bergantung pada paket openssl sistem. rust-tls tidak dipakai:
# ia menyalakan sha1-ring bersamaan dengan sha1-crypto-hash dan itu ditolak
# librqbit-sha1-wrapper ("only one of them can be enabled").
openssl-sys = { version = "0.9", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

# Remux opsional: unduh ffmpeg statis kalau tidak ada di sistem.
lzma-rs = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tar = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
# patch: forget_piece/want_piece untuk streaming RAM-only dengan evict + refetch
librqbit = { path = "vendor/librqbit" }
