[package]
name = "zanime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
librqbit = "8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
futures-util = "0.3"
bytes = "1"
serde_json = "1"
openssl-sys = { version = "0.9", features = ["vendored"] }

[patch.crates-io]
# patch: forget_piece/want_piece untuk streaming RAM-only dengan evict + refetch
librqbit = { path = "vendor/librqbit" }
