name: Release APK (split ABI)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: true # tag dibutuhkan untuk menentukan build number berikutnya

      - name: Next version from pubspec.yaml
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, subprocess, sys

          text = open("pubspec.yaml", encoding="utf-8").read()
          m = re.search(
              r"^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?\s*$", text, re.M
          )
          if not m:
              sys.exit("version: major.minor.patch[+build] not found in pubspec.yaml")
          core = tuple(map(int, m.groups()[:3]))
          build = int(m.group(4) or 1)

          tags = subprocess.run(
              ["git", "tag", "--list", "v*"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          matches = (re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?", t) for t in tags)
          latest_core, latest_build = max(
              ((tuple(map(int, t.groups()[:3])), int(t.group(4) or 0)) for t in matches if t),
              default=((0, 0, 0), 0),
          )

          if core < latest_core:
              sys.exit(
                  f"pubspec version {'.'.join(map(str, core))} is older than "
                  f"latest tag {'.'.join(map(str, latest_core))}"
              )

          # versionCode harus selalu naik agar update bisa terpasang.
          build = max(build, latest_build + 1)
          name = ".".join(map(str, core))
          print(f"name={name}")
          print(f"code={build}")
          print(f"tag={name}+{build}")
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Deteksi otomatis: path SDK dari runner, versi NDK dari build.gradle
      # aplikasi, atau default Flutter jika tidak diset di sana.
      - name: Detect toolchain
        id: toolchain
        run: |
          ndk=$(grep -rhoE 'ndkVersion[ =]+"[0-9.]+"' android/app/build.gradle* 2>/dev/null \
            | grep -oE '[0-9][0-9.]+' | head -1 || true)
          if [ -z "$ndk" ]; then
            flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
            ndk=$(sed -n 's/.*ndkVersion: String = "\([0-9.]*\)".*/\1/p' \
              "$flutter_root/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" \
              | head -1 || true)
          fi
          echo "sdk=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_OUTPUT"
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"
          echo "Detected NDK: ${ndk:-<none>}"

      # Cache Gradle user home, wrapper, dan build cache.
      - uses: gradle/actions/setup-gradle@v6

      # NDK & CMake dipasang oleh Android SDK manager (di luar cache Gradle),
      # jadi tanpa cache ini akan diunduh ulang di setiap run.
      - uses: actions/cache@v6
        if: steps.toolchain.outputs.ndk != ''
        with:
          path: ${{ steps.toolchain.outputs.sdk }}/ndk/${{ steps.toolchain.outputs.ndk }}
          key: android-ndk-${{ runner.os }}-${{ steps.toolchain.outputs.ndk }}

      - uses: actions/cache@v6
        with:
          path: ${{ steps.toolchain.outputs.sdk }}/cmake
          key: android-cmake-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: android-cmake-${{ runner.os }}-

      # Plugin media_kit mengunduh jar libmpv ke build dir; cache agar tidak
      # diunduh ulang di runner baru.
      - uses: actions/cache@v6
        with:
          path: build/media_kit_libs_android_video
          key: media-kit-libs-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      # Keystore datang dari satu secret (zip base64 berisi key.properties dan
      # app/zanime-release.keystore). Tanpa secret, build memakai debug signing.
      - name: Restore release keystore
        env:
          KEYSTORE_B64_ZIP: ${{ secrets.KEYSTORE_B64_ZIP }}
        run: |
          if [ -z "$KEYSTORE_B64_ZIP" ]; then
            echo "::warning::KEYSTORE_B64_ZIP kosong, build memakai debug signing"
            exit 0
          fi
          echo "$KEYSTORE_B64_ZIP" | base64 --decode > /tmp/keystore.zip
          # Zip dari Windows memakai path backslash; unzip memberi warning (exit 1).
          unzip -o /tmp/keystore.zip -d . || [ $? -eq 1 ]
          test -f android/key.properties
          test -f android/app/zanime-release.keystore

      - run: flutter pub get

      - name: Build split APKs
        run: >
          flutter build apk --release --split-per-abi
          --build-name "${{ steps.version.outputs.name }}"
          --build-number "${{ steps.version.outputs.code }}"

      - name: Name APKs after the version
        run: |
          mkdir -p dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk##*/app-}"
            abi="${abi%-release.apk}"
            cp "$apk" "dist/zanime-v${{ steps.version.outputs.tag }}-$abi.apk"
          done

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Zanime v${{ steps.version.outputs.name }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
