name: Release APK (split ABI)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to derive the next build number

      - name: Next version from pubspec.yaml
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re, subprocess, sys

          text = open("pubspec.yaml", encoding="utf-8").read()
          m = re.search(
              r"^version:\s*(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?\s*$",
              text,
              re.M,
          )
          if not m:
              sys.exit("version: major.minor.patch[+build] not found in pubspec.yaml")
          core = tuple(int(part) for part in m.group(1, 2, 3))
          build = int(m.group(4) or 1)

          tags = subprocess.run(
              ["git", "tag", "--list", "v*", "--sort=-v:refname"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          latest_core, latest_build = (0, 0, 0), 0
          for tag in tags:
              t = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:\+(\d+))?", tag)
              if not t:
                  continue
              tcore = tuple(int(part) for part in t.group(1, 2, 3))
              if tcore > latest_core or (
                  tcore == latest_core and int(t.group(4) or 0) > latest_build
              ):
                  latest_core, latest_build = tcore, int(t.group(4) or 0)

          if core < latest_core:
              sys.exit(
                  f"pubspec version {'.'.join(map(str, core))} is older than "
                  f"latest tag {'.'.join(map(str, latest_core))}"
              )

          # versionCode must keep growing for upgrades, even when only the
          # major/minor/patch in pubspec.yaml changed.
          build = max(build, latest_build + 1)
          name = ".".join(map(str, core))
          print(f"name={name}")
          print(f"code={build}")
          print(f"tag={name}+{build}")
          PY

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      # Keys follow the resolved toolchain versions, so an upgrade gets a fresh
      # cache instead of reusing stale NDK/libmpv files. Flutter's default
      # `ndkVersion` lives in its Gradle plugin; if that moves, the NDK cache is
      # skipped and the SDK manager just installs it as before.
      # https://github.com/actions/cache#creating-a-cache-key
      - name: Get toolchain versions
        id: toolchain
        run: |
          echo "flutter=$(flutter --version --machine | jq -r .frameworkVersion)" >> "$GITHUB_OUTPUT"
          flutter_root="${FLUTTER_ROOT:-$(dirname "$(dirname "$(command -v flutter)")")}"
          ndk=$(sed -n 's/.*val ndkVersion: String = "\([0-9.]*\)".*/\1/p' \
            "$flutter_root/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" | head -1)
          echo "ndk=$ndk" >> "$GITHUB_OUTPUT"

      # Caches Gradle user home, wrapper distribution, and build caches.
      - uses: gradle/actions/setup-gradle@v6

      # NDK/CMake are installed by the Android SDK manager, outside Gradle's
      # caches, and would otherwise be re-downloaded on every fresh runner.
      - uses: actions/cache@v6
        if: steps.toolchain.outputs.ndk != ''
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.toolchain.outputs.ndk }}
            ${{ env.ANDROID_SDK_ROOT }}/cmake
          key: android-native-${{ runner.os }}-${{ steps.toolchain.outputs.ndk }}-flutter-${{ steps.toolchain.outputs.flutter }}

      # media_kit's plugin downloads its libmpv jars into the module build dir;
      # `flutter clean` or a fresh runner throws that away.
      - uses: actions/cache@v6
        with:
          path: build/media_kit_libs_android_video
          key: media-kit-libs-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      # The release keystore arrives as one repo secret (never committed): a
      # base64 zip holding key.properties + app/zanime-release.keystore, so
      # every build signs with the same key and updates install cleanly.
      # Without the secret the build falls back to debug signing.
      - name: Restore release keystore
        if: env.KEYSTORE_B64_ZIP != ''
        env:
          KEYSTORE_B64_ZIP: ${{ secrets.KEYSTORE_B64_ZIP }}
        run: |
          echo "$KEYSTORE_B64_ZIP" | base64 --decode > /tmp/keystore.zip
          unzip -o /tmp/keystore.zip -d .

      - name: Resolve dependencies
        run: flutter pub get

      # Flutter configures AGP splits when --split-per-abi is set, so each APK
      # contains one ABI and gets its own versionCode offset. Pass the derived
      # version explicitly so every APK matches the release tag.
      - name: Build split APKs
        run: >
          flutter build apk --release --split-per-abi
          --build-name "${{ steps.version.outputs.name }}"
          --build-number "${{ steps.version.outputs.code }}"

      - name: Name APKs after the version
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
              "dist/zanime-v${{ steps.version.outputs.tag }}-$abi.apk"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: zanime-split-${{ steps.version.outputs.tag }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Zanime v${{ steps.version.outputs.name }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
